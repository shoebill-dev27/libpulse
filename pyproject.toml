[project]
name = "libpulse"
version = "0.1.0"
description = "Execution-verified knowledge base of library breaking changes and migration recipes, served to AI agents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0"]

[project.scripts]
libpulse = "libpulse.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: slow tests that create real venvs and install packages"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.black]
line-length = 100
